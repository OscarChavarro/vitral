<div class="dialog-backdrop" (click)="onCancel()"></div>

<div
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="shaders-url-dialog-title"
  (keydown)="onKeyDown($event)"
>
  <h2 class="dialog-title" id="shaders-url-dialog-title">Open the shading resources</h2>

  <form (submit)="onSubmit($event)">
    <label class="dialog-label" for="shaders-texture-url-input">Texture URL</label>
    <input
      class="dialog-input"
      id="shaders-texture-url-input"
      name="textureUrl"
      type="text"
      autocomplete="off"
      spellcheck="false"
      autofocus
      [value]="textureUrl()"
      (input)="onTextureUrlInput($event)"
    />

    <label class="dialog-label" for="shaders-bump-url-input">Bump map URL</label>
    <input
      class="dialog-input"
      id="shaders-bump-url-input"
      name="bumpMapUrl"
      type="text"
      autocomplete="off"
      spellcheck="false"
      [value]="bumpMapUrl()"
      (input)="onBumpMapUrlInput($event)"
    />

    <label class="dialog-label" for="shaders-csv-url-input">Microfacet material CSV URL</label>
    <input
      class="dialog-input"
      id="shaders-csv-url-input"
      name="microFacetCsvUrl"
      type="text"
      autocomplete="off"
      spellcheck="false"
      [value]="microFacetCsvUrl()"
      (input)="onMicroFacetCsvUrlInput($event)"
    />

    <p class="dialog-note">
      The bump map is an SGI <code>.bw</code> image and the CSV carries the Cook&ndash;Torrance
      materials <code>[m]</code> walks through. Press <code>[.]</code> to switch between the GPU
      shaders and the CPU raytracer, and <code>[g]</code>, <code>[p]</code>, <code>[n]</code> or
      <code>[F7]</code> to choose the shading model.
    </p>

    <div class="dialog-actions">
      <button class="dialog-button" type="button" (click)="onCancel()">Cancel</button>
      <button class="dialog-button primary" type="submit">Open</button>
    </div>
  </form>
</div>
