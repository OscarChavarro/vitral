configure(subprojects.findAll {
    it.path.startsWith(':testsuite:') &&
    it.buildFile.exists() &&
    it.path != ':testsuite:ApplicationCases:CommandServer'
}) {
    dependencies {
        implementation project(':base')
        implementation project(':awt')
    }
}

configure(subprojects.findAll {
    it.path.startsWith(':testsuite:Jogl4Examples:') &&
    it.buildFile.exists()
}) {
    dependencies {
        implementation project(':jogl4')
        implementation 'org.jogamp.jogl:jogl-all:2.5.0'
        implementation 'org.jogamp.gluegen:gluegen-rt:2.5.0'
        runtimeOnly 'org.jogamp.jogl:jogl-all-main:2.5.0'
        runtimeOnly 'org.jogamp.gluegen:gluegen-rt-main:2.5.0'
    }
}

configure(subprojects.findAll {
    it.path.startsWith(':testsuite:') &&
    it.buildFile.exists() &&
    it.path != ':testsuite:ApplicationCases:CommandServer' &&
    it.path != ':testsuite:_APITests:_JOGL2HelloWorld' &&
    it.path != ':testsuite:_APITests:_JOGL4HelloWorld' &&
    it.path != ':testsuite:_APITests:_JOGL4PbufferExample' &&
    !it.path.startsWith(':testsuite:VSDKExamples:') &&
    !it.path.startsWith(':testsuite:Jogl4Examples:')
}) {
    dependencies {
        implementation project(':jogl2')
        implementation 'org.jogamp.jogl:jogl-all:2.5.0'
        implementation 'org.jogamp.gluegen:gluegen-rt:2.5.0'
        runtimeOnly 'org.jogamp.jogl:jogl-all-main:2.5.0'
        runtimeOnly 'org.jogamp.gluegen:gluegen-rt-main:2.5.0'
    }
}
