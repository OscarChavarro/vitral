apply plugin: 'jacoco'

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    // Tests run serially inside each JVM (the kernel keeps per-call state in
    // static fields and ThreadLocals), but test classes are spread over
    // several forked JVMs, which share nothing (Fable5.2Analysis.md Stage F
    // step 3). Override with -PtestForks=N; -PtestForks=1 restores the old
    // single-JVM run.
    maxParallelForks = (project.findProperty('testForks') ?:
        Math.max(1, Math.min(8,
            Runtime.runtime.availableProcessors().intdiv(2)))).toString()
            .toInteger()
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    // Fatal kernel errors must fail a test, never kill the Gradle worker
    // (Fable5.2Analysis.md Stage A step 5).
    systemProperty 'vsdk.withSystemExit', 'false'
    // Slow oracle fuzz families run in the 'slowTest' task
    // (Fable5.2Analysis.md Stage A step 2).
    useJUnitPlatform {
        excludeTags 'slow'
    }
    // Stage 10 A/B harness: keeps the existing moon-cylinder unit-test
    // fixtures/assertions unchanged while selecting the new setOp flag.
    systemProperty 'vsdk.strictValidationBenchmark',
        (project.findProperty('strictValidationBenchmark') ?: 'false')
            .toString()
    // Opt-in: '-Pjfr' attaches Java Flight Recorder for CSG boolean profiling.
    // Writes base/build/profiling/test.jfr (settings=profile, dumponexit=true).
    if ( project.hasProperty('jfr') ) {
        File profilingDir = layout.buildDirectory.dir('profiling').get().asFile
        profilingDir.mkdirs()
        jvmArgs(
            '-XX:StartFlightRecording=settings=profile,dumponexit=true,' +
            'filename=' + new File(profilingDir, 'test.jfr').absolutePath)
    }
    finalizedBy(tasks.named('jacocoTestReport'))
}

tasks.register('slowTest', Test) {
    group = 'verification'
    description = 'Runs the slow-tagged oracle fuzz gates (Fable5.2Analysis.md Stage A).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
    maxParallelForks = 1
    // Large heap so a runaway case is told apart from a merely memory-hungry
    // one (the build machine has ~196 GB); override with -PslowTestHeap=...
    maxHeapSize = (project.findProperty('slowTestHeap') ?: '48g').toString()
    systemProperty 'vsdk.withSystemExit', 'false'
    testLogging {
        showStandardStreams = true
    }
}

tasks.named('jacocoTestReport') {
    dependsOn(tasks.named('test'))
    reports {
        html.required = true
        // HTML report in <java>/coverage/index.html (ignored by git).
        html.outputLocation = rootProject.layout.projectDirectory.dir('coverage')
        xml.required = true
        csv.required = false
    }
}

// Coverage of the fast and the slow-tagged tests together, also written to
// <java>/coverage/index.html (see scripts/testAllWithSlowCases.sh).
tasks.register('jacocoAllTestsReport', JacocoReport) {
    group = 'verification'
    description = 'Coverage report merging the test and slowTest executions.'
    dependsOn(tasks.named('test'), tasks.named('slowTest'))
    mustRunAfter(tasks.named('jacocoTestReport'))
    executionData(tasks.named('test').get(), tasks.named('slowTest').get())
    sourceSets(sourceSets.main)
    reports {
        html.required = true
        html.outputLocation = rootProject.layout.projectDirectory.dir('coverage')
        xml.required = true
        csv.required = false
    }
}
