apply plugin: 'jacoco'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    // Keep base tests in serial mode by default.
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    // Opt-in: '-Pjfr' attaches Java Flight Recorder for CSG boolean profiling.
    // Writes base/build/profiling/test.jfr (settings=profile, dumponexit=true).
    if ( project.hasProperty('jfr') ) {
        File profilingDir = layout.buildDirectory.dir('profiling').get().asFile
        profilingDir.mkdirs()
        jvmArgs(
            '-XX:StartFlightRecording=settings=profile,dumponexit=true,' +
            'filename=' + new File(profilingDir, 'test.jfr').absolutePath)
    }
    finalizedBy(tasks.named('jacocoTestReport'))
}

tasks.named('jacocoTestReport') {
    dependsOn(tasks.named('test'))
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}
