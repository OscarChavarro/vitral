<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitral Kernel</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<header>
  <h1>Vitral Kernel</h1>
  <p id="summary">connecting&hellip;</p>
</header>
<p id="offline" role="alert">The system is disconnected: there are no data updates from the kernel. Trying to reconnect every 5 seconds&hellip;</p>
<main>
  <section id="cores">
    <h2>Cores</h2>
    <canvas id="load" width="560" height="260"></canvas>
    <ul id="legend"></ul>
  </section>
  <section>
    <h2>Processes</h2>
    <table id="processes">
      <thead><tr><th>PID</th><th>PPID</th><th>Name</th><th>State</th><th>CPU</th><th>Console</th><th>%CPU</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<section class="wide">
  <h2>Kernel log</h2>
  <pre id="log"></pre>
</section>
<script src="index.js"></script>
</body>
</html>
